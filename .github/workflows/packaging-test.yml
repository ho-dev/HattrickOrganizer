name: Test Packaging

on:
  workflow_dispatch:

  # Temporary trigger for testing before the workflow is merged into master.
  push:
    branches:
      - "feature/test-packaging-macos-intel"

permissions:
  contents: read

jobs:
  packaging:
    name: Build Installers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Install install4j
        run: |
          wget https://download.ej-technologies.com/install4j/install4j_linux-x64_12_0_2.deb
          sudo dpkg -i install4j_linux-x64_12_0_2.deb

      - name: Build installers
        run: ./gradlew release
        env:
          INSTALL4J_HOME: /opt/install4j12
          INSTALL4J_LICENSE: ${{ secrets.INSTALL4J_LICENSE }}
          POEDITOR_APIKEY: ${{ secrets.POEDITOR_APIKEY }}
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_ARTEFACTS: true

      - name: Verify macOS Intel packages
        shell: bash
        run: |
          test -d build/artefacts

          mapfile -t packages < <(
            find build/artefacts -maxdepth 1 -type f \
              -name '*macOS-Intel*' -print
          )

          printf '%s\n' "${packages[@]}"

          if [[ ${#packages[@]} -ne 2 ]]; then
            echo "::error::Expected 2 macOS Intel packages, found ${#packages[@]}"
            exit 1
          fi

          for package in "${packages[@]}"; do
            test -s "$package"
          done

      - name: Upload macOS Intel packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-packages
          path: build/artefacts/*macOS-Intel*
          if-no-files-found: error
          retention-days: 7
